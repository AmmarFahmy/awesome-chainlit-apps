[project]
name = "chat-with-qwen3-coder"
version = "1.0.0"
description = "A Chainlit app for chatting with Qwen3 Coder AI model via OpenRouter"
authors = [
    {name = "Build Fast with AI", email = "info@buildfastwithai.com"}
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "chainlit",
    "langchain-openai",
    "langchain-core", 
    "langchain",
    "langchain-community",
    "openai",
    "tiktoken",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/AmmarFahmy/awesome-chainlit-apps"
Repository = "https://github.com/AmmarFahmy/awesome-chainlit-apps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [] 